<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jupyter to PDF Converter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        
        #drop-zone {
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            margin-bottom: 20px;
        }
        #drop-zone.dragover { background-color: #ebf5fb; border-color: #2980b9; }
        #drop-zone p { font-size: 1.2rem; color: #34495e; margin: 0; }
        
        #file-list { margin-top: 30px; }
        .file-item {
            background: #fff;
            border: 1px solid #eee;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-info { display: flex; flex-direction: column; }
        .file-name { font-weight: bold; color: #2c3e50; }
        .file-status { font-size: 0.9rem; margin-top: 5px; }
        
        .status-pending { color: #f39c12; }
        .status-converting { color: #3498db; font-style: italic; }
        .status-completed { color: #27ae60; font-weight: bold; }
        .status-failed { color: #e74c3c; }

        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; font-size: 0.9rem; transition: background 0.2s; }
        .btn-download { background-color: #2ecc71; color: white; }
        .btn-download:hover { background-color: #27ae60; }
        .btn-setup { background-color: #95a5a6; color: white; display: block; margin: 20px auto; }
        
        .error-details { font-size: 0.8rem; color: #e74c3c; max-width: 400px; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jupyter to PDF</h1>
        <p class="subtitle">Drag & drop your .ipynb files to convert them to high-quality PDF.</p>

        <div id="drop-zone">
            <p>Drop .ipynb files here or click to upload</p>
            <input type="file" id="file-input" multiple accept=".ipynb" style="display: none;">
        </div>

        <div id="file-list"></div>

        <button class="btn btn-setup" onclick="setupPlaywright()" id="setup-btn">Setup Offline Engine</button>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };

        dropZone.ondragleave = () => dropZone.classList.remove('dragover');

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };

        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            for (const file of files) {
                if (file.name.endsWith('.ipynb')) {
                    uploadFile(file);
                }
            }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            // Create placeholder in UI
            const item = document.createElement('div');
            item.className = 'file-item';
            const id = Math.random().toString(36).substr(2, 9);
            item.innerHTML = `
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-status status-pending" id="status-${id}">Uploading...</span>
                </div>
                <div id="action-${id}"></div>
            `;
            fileList.prepend(item);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.job_id) {
                    pollStatus(data.job_id, id);
                }
            } catch (error) {
                document.getElementById(`status-${id}`).innerText = 'Upload failed';
                document.getElementById(`status-${id}`).className = 'file-status status-failed';
            }
        }

        async function pollStatus(jobId, uiId) {
            const statusEl = document.getElementById(`status-${uiId}`);
            const actionEl = document.getElementById(`action-${uiId}`);
            
            const check = async () => {
                try {
                    const response = await fetch(`/status/${jobId}`);
                    const data = await response.json();
                    
                    statusEl.innerText = data.status.charAt(0).toUpperCase() + data.status.slice(1);
                    statusEl.className = `file-status status-${data.status}`;

                    if (data.status === 'completed') {
                        actionEl.innerHTML = `<a href="${data.download_url}" class="btn btn-download">Download PDF</a>`;
                        return;
                    } else if (data.status === 'failed') {
                        const err = document.createElement('div');
                        err.className = 'error-details';
                        err.innerText = data.error || 'Unknown error';
                        statusEl.parentElement.appendChild(err);
                        return;
                    }
                    
                    setTimeout(check, 2000); // Poll every 2 seconds
                } catch (e) {
                    statusEl.innerText = 'Connection lost';
                }
            };
            check();
        }

        async function setupPlaywright() {
            const btn = document.getElementById('setup-btn');
            btn.innerText = 'Installing (please wait)...';
            btn.disabled = true;
            try {
                const res = await fetch('/setup', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    alert('Offline engine ready!');
                    btn.innerText = 'Offline Engine Ready';
                } else {
                    alert('Setup failed: ' + data.detail);
                    btn.disabled = false;
                    btn.innerText = 'Setup Offline Engine';
                }
            } catch (e) {
                alert('Setup failed: ' + e);
                btn.disabled = false;
                btn.innerText = 'Setup Offline Engine';
            }
        }
    </script>
</body>
</html>
